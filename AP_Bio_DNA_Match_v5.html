<!DOCTYPE html>
<html lang="en">
<head>
  <title>DNA Matching</title>
  <style>
    /* Basic page setup */
    body {
      background-color: lightblue;
      font-family: 'Verdana', sans-serif;
      margin: 0;
      padding: 20px;
    }

    /* Center everything on the page */
    .container {
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Title styling */
    h1 {
      color: white;
      font-size: 60px;
      margin: 0;
      white-space: nowrap;
    }

    /* Subtitle under the title */
    .subtitle {
      color: #4c4c4c;
      font-size: 26px;
      margin-top: 5px;
      margin-bottom: 60px;
      white-space: nowrap;
      font-family: 'copperplate';
      font-weight: bold;
    }


    /* Labels for the input boxes */
    label {
      display: block;
      text-align: center;
      margin-bottom: 5px;
      font-weight: bold;
      color: white;
      font-size: 24px;
    }

    /* Text input boxes */
    input[type="text"] {
      width: 400px;
      padding: 12px;
      font-size: 20px;
      border: 1px solid #ffffff;
      margin-bottom: 15px;
      box-sizing: border-box;
      text-transform: uppercase;
      font-family: 'Arial', 'Helvetica', sans-serif;
      font-weight: bold;
    }
    
    input[type="text"]::placeholder {
      font-family: 'Arial', 'Helvetica', sans-serif;
      font-weight: bold;
    }

    /* The compare button */
    button {
      background-color: black; /* light blue */
      color: white;
      border: 1px solid white;
      padding: 12px 30px;
      font-size: 20px;
      cursor: pointer;
      margin-top: 5px;
      border-radius: 25px;
      font-family: 'Arial', 'Helvetica', sans-serif;
      font-weight: bold;
    }

    button:hover {
      background-color: white !important;
      color: black !important;
    }

    /* Button container for spacing */
    .button-container {
      margin-top: 15px;
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .button-container button {
      margin: 0;
    }

    .name {
      color: white;
      font-size: 26px;
      margin-top: 55px;
      font-family: 'Copperplate';
      font-weight: normal;
    }

    /* DNA Counter section */
    .dna-counter {
      display: inline-block;
      text-align: left;
      margin: 15px 10px;
      font-size: 14px;
      color: white;
    }

    .dna-counter h4 {
      margin: 0 0 8px 0;
      font-size: 16px;
    }

    .dna-counter p {
      margin: 3px 0;
    }

    /* Similarity message */
    .similarity-message {
      font-size: 16px;
      font-weight: bold;
      margin-top: 8px;
    }

    /* DNA facts section */
    .dna-fact {
      margin-top: 15px;
      padding: 10px;
      background-color: #111111;
      border-left: 3px solid #ffffff;
      font-size: 14px;
      color: white;
      font-style: italic;
    }

    /* Legend */
    .legend {
      margin-top: 15px;
      font-size: 13px;
      color: white;
      text-align: center;
    }

    .legend p {
      margin: 3px 0;
    }

    /* ===== ANIMATED DNA BACKGROUND ===== */
    /* Simple DNA double helix made with CSS circles and lines */
    .dna-background {
      position: fixed;
      width: 100px;
      height: 1000px;
      opacity: 0.5;
      pointer-events: none;
      z-index: 0;
    }

    /* Left side DNA */
    .dna-background-left {
      top: 50px;
      left: 20px;
    }

    /* Right side DNA */
    .dna-background-right {
      top: 50px;
      right: 20px;
    }

    /* DNA animation: slow rotation and gentle floating */
    @keyframes dnaRotate {
      0% {
        transform: rotateZ(0deg) translateY(0px);
      }
      50% {
        transform: rotateZ(5deg) translateY(-15px);
      }
      100% {
        transform: rotateZ(0deg) translateY(0px);
      }
    }

    .dna-background {
      animation: dnaRotate 8s ease-in-out infinite;
    }

    /* Left strand circles */
    .dna-strand-left {
      position: absolute;
      left: 10px;
      width: 18px;
      height: 18px;
      background-color: #8b7cc4;
      border-radius: 50%;
      margin: 20px 0;
      box-shadow: 0 0 8px rgba(139, 124, 196, 0.6);
    }

    /* Right strand circles */
    .dna-strand-right {
      position: absolute;
      right: 10px;
      width: 18px;
      height: 18px;
      background-color: #9bb8d9;
      border-radius: 50%;
      margin: 20px 0;
      box-shadow: 0 0 8px rgba(155, 184, 217, 0.6);
    }

    /* Connector lines between strands */
    .dna-connector {
      position: absolute;
      height: 3px;
      background-color: #a8a8d9;
      left: 28px;
      width: 44px;
      box-shadow: 0 0 6px rgba(168, 168, 217, 0.5);
    }

    /* ===== LOADING ANIMATION ===== */
    /* Loading panel that appears during DNA analysis */
    .loading-panel {
      display: none;
      text-align: center;
      margin-top: 20px;
      margin-bottom: 30px;
      padding: 20px;
      background-color: #000000;
      border: 2px solid #ffffff;
      border-radius: 10px;
    }

    .loading-panel p {
      color: white;
      font-size: 18px;
      margin: 0 0 15px 0;
      font-family: 'Arial', 'Helvetica', sans-serif;
      font-weight: bold;
    }

    /* Simple loading bar animation */
    .loading-bar-container {
      width: 100%;
      height: 8px;
      background-color: #333333;
      border-radius: 5px;
      overflow: hidden;
    }

    .loading-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #518ecf, #e8e160);
      border-radius: 5px;
      animation: loadingBarMove 1.5s ease-in-out forwards;
    }

    /* Loading bar animation: fills up from left to right */
    @keyframes loadingBarMove {
      0% {
        width: 0%;
      }
      100% {
        width: 100%;
      }
    }

    /* Results section */
    .results {
      margin-top: 5px;
      margin-bottom: -10px;
      background-color: #000000; /* very light blue */
      border: 1px solid #aaaaaa;
      padding: 15px;
      text-align: left;
    }

    .results h2 {
      margin-top: 0;
      color: white;
      font-size: 18px;
    }

    .results p {
      font-size: 15px;
      color: white;
      margin: 6px 0;
    }

    /* Error message */
    .error {
      color: white;
      font-size: 18px;
      margin-top: 15px;
      padding: 15px 20px;
      background-color: #d32f2f;
      border-radius: 8px;
      border: 2px solid #b71c1c;
      font-weight: bold;
      min-height: 20px;
      display: none;
    }

    /* Show error box only when it has content */
    .error:not(:empty) {
      display: block;
    }

    /* Letter-by-letter comparison display */
    .letter-row {
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      font-size: 18px;
      margin-top: 10px;
      letter-spacing: 4px;
    }

    .match {
      color: rgb(97, 155, 97);
    }

    .no-match {
      color: rgb(238, 132, 132);
    }

    /* ===== LIVE TYPING TIP BOX ===== */
    /* Small fact box that appears while the user is typing */
    .typing-tip {
      width: 400px;
      margin-top: 5px;
      margin-bottom: 10px;
      padding: 13px 14px;
      background-color: #8970c5;
      border-left: 3px solid #675b95;
      border-radius: 5px;
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      text-align: left;
      box-sizing: border-box;
      font-family: 'copperplate';
    }

    /* ===== MUTATION MESSAGE ===== */
    /* Success message shown after mutation in green box */
    .mutation-message {
      color: white;
      font-size: 16px;
      margin-top: 15px;
      padding: 15px 20px;
      background-color: #2e7d32;
      border-radius: 8px;
      border: 2px solid #1b5e20;
      font-weight: bold;
      min-height: 20px;
      display: none;
    }

    .mutation-message.show {
      display: block;
    }

    /* ===== SIMILARITY METER BAR ===== */
    /* Visual bar showing DNA similarity percentage */
    .similarity-meter {
      width: 100%;
      height: 20px;
      background-color: #333333;
      border-radius: 10px;
      margin-top: 12px;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .similarity-meter-fill {
      height: 100%;
      background: linear-gradient(90deg, #51cf66, #51cf66);
      width: 0%;
      border-radius: 10px;
      transition: width 0.5s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    /* ===== COMPARISON HISTORY ===== */
    /* Shows last 3 DNA comparisons */
    .comparison-history {
      margin-top: 20px;
      padding: 15px;
      background-color: #111111;
      border: 1px solid #aaaaaa;
      border-radius: 8px;
    }

    .comparison-history h4 {
      color: white;
      margin: 0 0 10px 0;
      font-size: 16px;
    }

    .history-item {
      color: white;
      font-size: 13px;
      margin: 6px 0;
      padding: 5px;
      background-color: #1a1a1a;
      border-left: 3px solid #8b7cc4;
      padding-left: 10px;
    }

    /* ===== MUTATION POSITION ===== */
    /* Shows where mutations detected in green box */
    .mutation-positions {
      color: white;
      font-size: 16px;
      margin-top: 15px;
      padding: 15px 20px;
      background-color: #2e7d32;
      border-radius: 8px;
      border: 2px solid #1b5e20;
      font-weight: bold;
      min-height: 20px;
      display: none;
    }

    /* Show mutation box only when it has content */
    .mutation-positions:not(:empty) {
      display: block;
    }
  </style>
</head>
<body>

  <!-- ===== ANIMATED DNA BACKGROUND ===== -->
  <!-- Simple DNA double helix animation in the background -->
  
  <!-- Left side DNA -->
  <div class="dna-background dna-background-left">
    <div class="dna-strand-left" style="top: 0px;"></div>
    <div class="dna-strand-right" style="top: 0px;"></div>
    <div class="dna-connector" style="top: 12px;"></div>

    <div class="dna-strand-left" style="top: 40px;"></div>
    <div class="dna-strand-right" style="top: 40px;"></div>
    <div class="dna-connector" style="top: 52px;"></div>

    <div class="dna-strand-left" style="top: 80px;"></div>
    <div class="dna-strand-right" style="top: 80px;"></div>
    <div class="dna-connector" style="top: 92px;"></div>

    <div class="dna-strand-left" style="top: 120px;"></div>
    <div class="dna-strand-right" style="top: 120px;"></div>
    <div class="dna-connector" style="top: 132px;"></div>
  </div>

  <!-- Right side DNA -->
  <div class="dna-background dna-background-right">
    <div class="dna-strand-left" style="top: 0px;"></div>
    <div class="dna-strand-right" style="top: 0px;"></div>
    <div class="dna-connector" style="top: 12px;"></div>

    <div class="dna-strand-left" style="top: 40px;"></div>
    <div class="dna-strand-right" style="top: 40px;"></div>
    <div class="dna-connector" style="top: 52px;"></div>

    <div class="dna-strand-left" style="top: 80px;"></div>
    <div class="dna-strand-right" style="top: 80px;"></div>
    <div class="dna-connector" style="top: 92px;"></div>

    <div class="dna-strand-left" style="top: 120px;"></div>
    <div class="dna-strand-right" style="top: 120px;"></div>
    <div class="dna-connector" style="top: 132px;"></div>
  </div>

  <div class="container">

    <!-- Title and subtitle -->
    <h1>DNA Matching</h1>
    <p class="subtitle">Compare two DNA strands to see their similarities</p>

    <!-- Input box 1 -->
    <label for="seq1">DNA Sequence 1:</label>
    <input type="text" id="seq1" placeholder="e.g. ATGCC" oninput="playTypeSound(); validateDNAInput(); clearResults(); showTypingFact();" />

    <!-- Input box 2 -->
    <label for="seq2">DNA Sequence 2:</label>
    <input type="text" id="seq2" placeholder="e.g. ATACC" oninput="playTypeSound(); validateDNAInput(); clearResults(); showTypingFact();" />

    <!-- ===== LIVE TYPING TIP ===== -->
    <!-- Shows a fun DNA fact while the user is typing — before they click Compare -->
    <div class="typing-tip" id="typingTip">
       Start typing a DNA sequence to get a fun DNA tip!
    </div>

    <!-- Button container for all buttons -->
    <div class="button-container">
      <button style="background-color: #000000;" onclick="playButtonSound(); compareDNA()">Compare DNA</button>
    </div>

    <!-- Error message area -->
    <p class="error" id="errorMsg"></p>

    <!-- Mutation message -->
    <p class="mutation-message" id="mutationMessage">✓ Mutation detected!</p>

    <!-- ===== LOADING PANEL ===== -->
    <!-- Shows while DNA is being "analyzed" -->
    <div class="loading-panel" id="loadingPanel">
      <p id="loadingText">Analyzing DNA Sequence...</p>
      <div class="loading-bar-container">
        <div class="loading-bar-fill"></div>
      </div>
    </div>

    <!-- Results box (hidden until button is clicked) -->
    <div class="results" id="resultsBox" style="display: none;">
      <h2>Results:</h2>
      <p id="matchResult"></p>
      <p id="similarityResult"></p>
      <p class="similarity-message" id="similarityMessage"></p>

      <!-- ===== SIMILARITY METER BAR ===== -->
      <!-- Visual bar showing DNA similarity -->
      <div class="similarity-meter">
        <div class="similarity-meter-fill" id="similarityMeterFill"></div>
      </div>

      <p id="lengthNote"></p>
      
      <!-- Sequence length display -->
      <p id="seq1Length"></p>
      <p id="seq2Length"></p>

      <!-- Show the sequences side by side with color coding -->
      <p><strong>Sequence 1:</strong></p>
      <div class="letter-row" id="seq1Display"></div>
      <p><strong>Sequence 2:</strong></p>
      <div class="letter-row" id="seq2Display"></div>

      <!-- Match legend -->
      <div class="legend">
        <p><span style="color: rgb(97, 155, 97);">●</span> Match &nbsp; <span style="color: rgb(238, 132, 132);">●</span> No Match &nbsp; <span style="color: gray;">●</span> Extra Letter</p>
      </div>

      <!-- DNA Letter Counter -->
      <div style="text-align: center;">
        <div class="dna-counter" id="seq1Counter"></div>
        <div class="dna-counter" id="seq2Counter"></div>
      </div>

      <!-- DNA Facts -->
      <div class="dna-fact" id="dnaFact"></div>

      <!-- ===== MUTATION POSITIONS ===== -->
      <!-- Shows where mutations were detected -->
      <div class="mutation-positions" id="mutationPositions"></div>

      <!-- ===== COMPARISON HISTORY ===== -->
      <!-- Shows last 3 DNA comparisons -->
      <div class="comparison-history" id="comparisonHistory" style="display: none;">
        <h4>Recent Comparisons:</h4>
        <div id="historyList"></div>
      </div>
    </div>

    <!-- Bottom buttons -->
    <div class="button-container">
      <button style="background-color: #6987ad;" onclick="playButtonSound(); resetForm()">Reset</button>
      <button style="background-color: #623962;" onclick="playButtonSound(); generateRandomDNA(); clearErrorMessage(); clearResults(); lastSeq1 = ''; lastSeq2 = '';">Generate Random DNA</button>
      <button style="background-color: #d4683c;" onclick="playButtonSound(); mutateDNA()">Mutate DNA</button>
    </div>

    <p class="name">© 2026 Trilo Thilakarajan</p>

  </div>

  <script>
    // Array of DNA facts for the user
    var dnaFacts = [
      "DNA stands for Deoxyribonucleic Acid.",
      "Humans share about 60% of their DNA with bananas.",
      "DNA is found in almost every cell.",
      "Each person has unique DNA (except identical twins).",
      "DNA was discovered by James Watson, Francis Crick, and Rosalind Franklin.",
      "A human DNA strand is about 6 billion base pairs long.",
      "Cats share about 90% of their DNA with humans."
    ];

    // ===== TYPING TIPS =====
    // These are the fun facts shown WHILE the user types — before clicking Compare.
    // This is separate from the dnaFacts shown after a comparison.
    var typingFacts = [
      "DNA stands for deoxyribonucleic acid.",
      "Genes are small sections of DNA.",
      "DNA is found in the nucleus of most cells.",
      "Your DNA comes from both of your parents.",
      "A DNA strand is made of nucleotides.",
      "Mutations are changes in DNA sequences.",
      "Some mutations can be helpful, harmful, or neutral.",
      "DNA helps cells make proteins.",
      "Proteins help build and run your body.",
      "RNA helps carry DNA’s instructions.",
    "DNA replication means copying DNA.",
"DNA bases are like letters in a code.",
"Different DNA sequences can create different traits.",
"Most of your DNA is the same as other humans.",
"DNA can be used in forensics.",
"Identical twins have almost the same DNA.",
"DNA is too small to see without special tools.",
"Cells read DNA in groups of three bases.",
"A group of three DNA bases is called a codon.",
"DNA makes each living thing unique.",
"DNA was first discovered in 1869.",
"The double helix shape was discovered in 1953.",
"Your body contains trillions of cells with DNA.",
"DNA can be damaged by UV radiation.",
"Chromosomes are made of tightly packed DNA.",
"Humans have 23 pairs of chromosomes.",
"Bacteria also have DNA.",
"Some viruses use RNA instead of DNA.",
"DNA testing can help trace ancestry.",
"Each person’s DNA sequence is slightly different.",
"DNA is copied with very high accuracy.",
"Scientists can study DNA to learn about evolution.",
"Fruit flies are often used in genetics research.",
"Plants, animals, and bacteria all contain genetic material.",
"The human genome contains billions of DNA letters.",
"DNA controls inherited traits like eye color.",
"Genes can influence how tall you grow.",
"Some traits are controlled by multiple genes.",
"DNA can be extracted from cheek cells.",
"Your DNA is unique except for identical twins.",
"Scientists use DNA sequencing to read genetic code.",
"DNA can be stored for thousands of years in fossils.",
"Some organisms can repair damaged DNA.",
"Mitochondria have their own DNA.",
"DNA evidence is used in criminal investigations.",
"Bananas share some DNA with humans.",
"DNA acts like an instruction manual for life.",
"Cells constantly read and use DNA information.",
"Not all DNA codes for proteins.",
"DNA research has helped develop modern medicine."
    ];

    // Pick a random typing fact and show it in the tip box
    function showTypingFact() {
      // Pick a random index from the typingFacts array
      var randomIndex = Math.floor(Math.random() * typingFacts.length);

      // Put that fact into the tip box on the page
      document.getElementById("typingTip").textContent = typingFacts[randomIndex];
    }

    // Get a random DNA fact
    function getRandomFact() {
      var randomIndex = Math.floor(Math.random() * dnaFacts.length);
      return dnaFacts[randomIndex];
    }

    // Clear error message when user types or clicks Generate
    function clearErrorMessage() {
      document.getElementById("errorMsg").textContent = "";
    }

    // Hide the results box and loading panel (called when user starts a new comparison)
    function clearResults() {
      // Hide the results box so old results don't linger
      document.getElementById("resultsBox").style.display = "none";
      // Also hide the loading panel in case it's still visible
      document.getElementById("loadingPanel").style.display = "none";
    }

    // ===== LIVE INVALID LETTER DETECTION =====
    // This runs every time the user types a character in either input box.
    // It checks both boxes for invalid letters and shows an error right away.
    // If all letters are valid (or the box is empty), the error is cleared.
    function validateDNAInput() {
      // Get whatever is currently typed in both boxes, converted to uppercase
      var seq1 = document.getElementById("seq1").value.toUpperCase();
      var seq2 = document.getElementById("seq2").value.toUpperCase();

      // This pattern only allows A, T, G, and C — nothing else
      var validLetters = /^[ATGC]*$/;

      // Check if either box contains an invalid letter
      if (!validLetters.test(seq1) || !validLetters.test(seq2)) {
        // Show the red error box — same style as the other error messages
        document.getElementById("errorMsg").textContent = "Only use DNA letters: A, T, G, C";
      } else {
        // All letters are valid — clear the error message
        document.getElementById("errorMsg").textContent = "";
      }
    }

    // ===== REPEATED COMPARISON TRACKING =====
    // These store the last sequences the user successfully compared.
    // If they click Compare again with the same sequences, we show a message instead.
    var lastSeq1 = "";
    var lastSeq2 = "";
    
    // Flag to track if there's a pending comparison loading
    var pendingComparisonTimeout = null;

    // ===== COMPARISON HISTORY =====
    // Store the last 3 DNA comparisons in an array
    var comparisonHistory = [];

    // ===== LOADING ANIMATION =====
    // Variable to store the loading interval
    var loadingInterval = null;

    // ===== SOUND EFFECTS SYSTEM =====
    // Create audio context for generating simple sounds
    var audioContext = null;

    // Initialize audio context (must happen after user interaction)
    function initAudioContext() {
      if (audioContext === null) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // ===== TYPING SOUND =====
    // Play a soft clicking sound when user types
    function playTypeSound() {
      initAudioContext();
      
      // Create a short beep sound using oscillator
      var now = audioContext.currentTime;
      var osc = audioContext.createOscillator();
      var gain = audioContext.createGain();
      
      osc.connect(gain);
      gain.connect(audioContext.destination);
      
      // High-pitched short beep for typing
      osc.frequency.setValueAtTime(1000, now);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
      
      osc.start(now);
      osc.stop(now + 0.05);
    }

    // ===== BUTTON CLICK SOUND =====
    // Play a slightly lower click sound for buttons
    function playButtonSound() {
      initAudioContext();
      
      // Create a click sound
      var now = audioContext.currentTime;
      var osc = audioContext.createOscillator();
      var gain = audioContext.createGain();
      
      osc.connect(gain);
      gain.connect(audioContext.destination);
      
      // Medium-pitched click for buttons
      osc.frequency.setValueAtTime(800, now);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
      
      osc.start(now);
      osc.stop(now + 0.08);
    }

    // ===== LOADING BEEP =====
    // Play a small beep when loading starts
    function playLoadingBeep() {
      initAudioContext();
      
      // Create a loading beep sound
      var now = audioContext.currentTime;
      var osc = audioContext.createOscillator();
      var gain = audioContext.createGain();
      
      osc.connect(gain);
      gain.connect(audioContext.destination);
      
      // Low-pitched beep for loading
      osc.frequency.setValueAtTime(600, now);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      
      osc.start(now);
      osc.stop(now + 0.1);
    }

    // Add a comparison to the history
    function addToHistory(seq1, seq2, similarity) {
      // Create a new history entry
      var historyEntry = seq1 + " vs " + seq2 + " → " + similarity + "%";
      
      // Add it to the beginning of the array (newest first)
      comparisonHistory.unshift(historyEntry);
      
      // Only keep the latest 3 comparisons
      if (comparisonHistory.length > 3) {
        comparisonHistory.pop();
      }

      // Display the updated history
      displayHistory();
    }

    // Display the comparison history on the page
    function displayHistory() {
      var historyHTML = "";
      
      // Loop through each history entry
      for (var i = 0; i < comparisonHistory.length; i++) {
        historyHTML += "<div class='history-item'>" + comparisonHistory[i] + "</div>";
      }
      
      // Put the history into the page
      document.getElementById("historyList").innerHTML = historyHTML;
      
      // Show the history section only if there are entries
      if (comparisonHistory.length > 0) {
        document.getElementById("comparisonHistory").style.display = "block";
      }
    }

    // ===== MUTATION DETECTOR =====
    // Find positions where mutations (mismatches) occur
    function detectMutationPositions(seq1, seq2) {
      var positions = [];
      var shorterLength = seq1.length;
      
      if (seq2.length < shorterLength) {
        shorterLength = seq2.length;
      }
      
      // Loop through each position
      for (var i = 0; i < shorterLength; i++) {
        // If letters don't match, this is a mutation position
        if (seq1[i] !== seq2[i]) {
          // Store the position (add 1 because humans count from 1, not 0)
          positions.push(i + 1);
        }
      }
      
      return positions;
    }

    // Display mutation positions on the page
    function displayMutationPositions(positions) {
      if (positions.length === 0) {
        document.getElementById("mutationPositions").innerHTML = "✓ No mutations detected";
        document.getElementById("mutationPositions").style.display = "block";
      } else {
        var positionText = positions.join(", ");
        document.getElementById("mutationPositions").innerHTML = 
          "⚠ Mutation detected at positions: " + positionText;
        document.getElementById("mutationPositions").style.display = "block";
      }
    }

    // Generate random DNA sequences
    function generateRandomDNA() {
      // DNA letters
      var dnaLetters = ["A", "T", "G", "C"];
      
      // Generate random length between 8 and 12
      var length1 = 8 + Math.floor(Math.random() * 5);
      var length2 = 8 + Math.floor(Math.random() * 5);
      
      // Build first random sequence
      var randomSeq1 = "";
      for (var i = 0; i < length1; i++) {
        var randomIndex = Math.floor(Math.random() * 4);
        randomSeq1 = randomSeq1 + dnaLetters[randomIndex];
      }
      
      // Build second random sequence
      var randomSeq2 = "";
      for (var i = 0; i < length2; i++) {
        var randomIndex = Math.floor(Math.random() * 4);
        randomSeq2 = randomSeq2 + dnaLetters[randomIndex];
      }
      
      // Put the sequences into the input boxes
      document.getElementById("seq1").value = randomSeq1;
      document.getElementById("seq2").value = randomSeq2;
      
      // Trigger oninput events to update the UI
      var event1 = new Event('input', { bubbles: true });
      document.getElementById("seq1").dispatchEvent(event1);
      
      var event2 = new Event('input', { bubbles: true });
      document.getElementById("seq2").dispatchEvent(event2);
    }

    // ===== MUTATE DNA FUNCTION =====
    // Randomly change 1 or 2 letters in DNA Sequence 1
    function mutateDNA() {
      // Get the current sequence 1
      var seq1 = document.getElementById("seq1").value.toUpperCase();
      
      // Check if the box is empty
      if (seq1 === "") {
        document.getElementById("errorMsg").textContent = "Please enter a DNA sequence first!";
        return;
      }
      
      // Check if it's valid DNA
      var validLetters = /^[ATGC]+$/;
      if (!validLetters.test(seq1)) {
        document.getElementById("errorMsg").textContent = "Only use DNA letters: A, T, G, C";
        return;
      }

      // Convert string to array so we can modify it
      var seqArray = seq1.split("");
      
      // DNA letters for random replacement
      var dnaLetters = ["A", "T", "G", "C"];
      
      // Randomly decide to mutate 1 or 2 letters
      var numMutations = Math.random() < 0.5 ? 1 : 2;
      
      // Perform the mutations
      for (var m = 0; m < numMutations; m++) {
        // Pick a random position in the sequence
        var randomPosition = Math.floor(Math.random() * seqArray.length);
        
        // Pick a random DNA letter
        var randomLetterIndex = Math.floor(Math.random() * 4);
        var newLetter = dnaLetters[randomLetterIndex];
        
        // Replace the letter at that position
        seqArray[randomPosition] = newLetter;
      }
      
      // Convert array back to string and put it back into the input box
      var mutatedSeq = seqArray.join("");
      document.getElementById("seq1").value = mutatedSeq;
      
      // Trigger the oninput event to update the UI (validation, letter counter, etc.)
      var event = new Event('input', { bubbles: true });
      document.getElementById("seq1").dispatchEvent(event);
      
      // Clear error message
      document.getElementById("errorMsg").textContent = "";
      
      // Show the mutation message
      var mutationMsg = document.getElementById("mutationMessage");
      mutationMsg.classList.add("show");
      
      // Hide the message after 2 seconds
      setTimeout(function() {
        mutationMsg.classList.remove("show");
      }, 1000);
      
      // Clear any pending comparison timeout so it doesn't interfere
      if (pendingComparisonTimeout !== null) {
        clearTimeout(pendingComparisonTimeout);
        pendingComparisonTimeout = null;
      }
      
      // Clear results so the user can compare again
      clearResults();
      lastSeq1 = "";
      lastSeq2 = "";
    }

    // Reset the form
    function resetForm() {
      // Clear the input boxes
      document.getElementById("seq1").value = "";
      document.getElementById("seq2").value = "";
      
      // Clear error messages
      document.getElementById("errorMsg").textContent = "";
      
      // Hide the results box and loading panel
      document.getElementById("resultsBox").style.display = "none";
      document.getElementById("loadingPanel").style.display = "none";

      // Reset the typing tip back to the default welcome message
      document.getElementById("typingTip").textContent = "Start typing a DNA sequence to get a fun DNA tip!";

      // Clear the stored sequences so the next comparison runs the full loading animation
      lastSeq1 = "";
      lastSeq2 = "";
      
      // Clear the comparison history
      comparisonHistory = [];
      document.getElementById("comparisonHistory").style.display = "none";
      document.getElementById("historyList").innerHTML = "";
      
      // Hide the mutation message
      document.getElementById("mutationMessage").classList.remove("show");
    }

    // Count how many times each letter appears in a sequence
    function countLetters(sequence) {
      var counts = {
        "A": 0,
        "T": 0,
        "G": 0,
        "C": 0
      };
      
      // Loop through each letter
      for (var i = 0; i < sequence.length; i++) {
        var letter = sequence[i];
        if (letter === "A") {
          counts.A = counts.A + 1;
        } else if (letter === "T") {
          counts.T = counts.T + 1;
        } else if (letter === "G") {
          counts.G = counts.G + 1;
        } else if (letter === "C") {
          counts.C = counts.C + 1;
        }
      }
      
      return counts;
    }

    // Get similarity message based on percentage
    function getSimilarityMessage(percentage) {
      if (percentage >= 90) {
        return "Very Similar DNA";
      } else if (percentage >= 60) {
        return "Moderately Similar DNA";
      } else {
        return "Low Similarity";
      }
    }

    // Get color based on similarity
    function getSimilarityColor(percentage) {
      if (percentage >= 90) {
        return "rgb(97, 155, 97)"; // Green
      } else if (percentage >= 60) {
        return "rgb(255, 165, 0)"; // Orange
      } else {
        return "rgb(238, 132, 132)"; // Red
      }
    }

    // Main function that runs when Compare DNA button is clicked
    function compareDNA() {

      // Get what the user typed in
      var seq1 = document.getElementById("seq1").value.toUpperCase().trim();
      var seq2 = document.getElementById("seq2").value.toUpperCase().trim();

      // Clear any old error messages
      document.getElementById("errorMsg").textContent = "";

      // Check that both boxes have something in them
      if (seq1 === "" || seq2 === "") {
        document.getElementById("errorMsg").textContent = "Please enter both DNA sequences!";
        document.getElementById("resultsBox").style.display = "none";
        document.getElementById("loadingPanel").style.display = "none";
        return;
      }

      // Check that the letters are valid DNA letters (only A, T, G, C)
      var validLetters = /^[ATGC]+$/;
      if (!validLetters.test(seq1) || !validLetters.test(seq2)) {
        document.getElementById("errorMsg").textContent = "Only use DNA letters: A, T, G, C";
        document.getElementById("resultsBox").style.display = "none";
        document.getElementById("loadingPanel").style.display = "none";
        return;
      }

      // ===== REPEATED COMPARISON CHECK =====
      // If the user clicks Compare with the exact same sequences as last time,
      // skip the loading animation and show a friendly message instead.
      if (seq1 === lastSeq1 && seq2 === lastSeq2) {
        document.getElementById("errorMsg").textContent = "These sequences were already compared! Try changing them first.";
        return;
      }

      // ===== SHOW LOADING PANEL =====
      // These are new sequences — show the loading animation as normal
      document.getElementById("loadingPanel").style.display = "block";
      document.getElementById("resultsBox").style.display = "none";

      // ===== PLAY LOADING BEEP =====
      // Play a small beep to indicate loading has started
      playLoadingBeep();

      // ===== START ANIMATED LOADING TEXT =====
      // Start the animated dots animation
      startLoadingAnimation();

      // ===== FAKE LOADING WITH setTimeout =====
      // After 1.5 seconds, show the real results
      // Clear any previous pending timeout first
      if (pendingComparisonTimeout !== null) {
        clearTimeout(pendingComparisonTimeout);
      }
      
      pendingComparisonTimeout = setTimeout(function() {
        // Stop the loading animation
        stopLoadingAnimation();
        
        // Save these as the last compared sequences BEFORE showing results
        lastSeq1 = seq1;
        lastSeq2 = seq2;
        showDNAResults(seq1, seq2);
        
        // Clear the pending timeout flag
        pendingComparisonTimeout = null;
      }, 1500);
    }

    // ===== ANIMATED LOADING TEXT =====
    // This makes the loading text show: "Analyzing DNA." then "Analyzing DNA.." then "Analyzing DNA..."
    function startLoadingAnimation() {
      var dotCount = 0;
      
      // Update the loading text every 400 milliseconds
      loadingInterval = setInterval(function() {
        // Cycle through 0, 1, 2, 3 dots (then back to 0)
        dotCount = (dotCount + 1) % 4;
        
        // Create the dot string (0 dots, 1 dot, 2 dots, 3 dots)
        var dots = "";
        for (var i = 0; i < dotCount; i++) {
          dots += ".";
        }
        
        // Update the loading text with the animated dots
        document.getElementById("loadingText").textContent = "Analyzing DNA" + dots;
      }, 400);
    }

    // Stop the loading animation and clear the interval
    function stopLoadingAnimation() {
      // Stop the animation
      if (loadingInterval !== null) {
        clearInterval(loadingInterval);
        loadingInterval = null;
      }
      
      // Reset the loading text back to normal
      document.getElementById("loadingText").textContent = "Analyzing DNA Sequence...";
    }

    // Helper function: Display DNA results after loading is done
    function showDNAResults(seq1, seq2) {
      // Hide the loading panel
      document.getElementById("loadingPanel").style.display = "none";

      // Figure out which sequence is shorter (we compare up to that length)
      var shorterLength = seq1.length;
      if (seq2.length < shorterLength) {
        shorterLength = seq2.length;
      }

      // Count how many letters match at the same position
      var matchCount = 0;

      // Loop through each letter one at a time
      for (var i = 0; i < shorterLength; i++) {
        if (seq1[i] === seq2[i]) {
          matchCount = matchCount + 1; // found a match!
        }
      }

      // Calculate the percent similarity
      var similarity = (matchCount / shorterLength) * 100;
      var similarityRounded = Math.round(similarity);

      // Show the results box
      document.getElementById("resultsBox").style.display = "block";

      // Display the match count and total
      document.getElementById("matchResult").textContent =
        matchCount + " out of " + shorterLength + " letters match";

      // Display the percent similarity with color
      var similarityColor = getSimilarityColor(similarityRounded);
      document.getElementById("similarityResult").innerHTML =
        "<strong style='color: " + similarityColor + ";'>DNA Similarity: " + similarityRounded + "%</strong>";

      // Display similarity message
      var message = getSimilarityMessage(similarityRounded);
      document.getElementById("similarityMessage").textContent = message;
      document.getElementById("similarityMessage").style.color = similarityColor;

      // ===== UPDATE SIMILARITY METER =====
      // Fill the bar based on similarity percentage and set color
      var meterColor = similarityColor;
      document.getElementById("similarityMeterFill").style.width = similarityRounded + "%";
      document.getElementById("similarityMeterFill").style.background = "linear-gradient(90deg, " + meterColor + ", " + meterColor + ")";
      document.getElementById("similarityMeterFill").textContent = similarityRounded + "%";

      // Display sequence lengths
      document.getElementById("seq1Length").textContent = "Sequence 1 Length: " + seq1.length;
      document.getElementById("seq2Length").textContent = "Sequence 2 Length: " + seq2.length;

      // If the sequences are different lengths, tell the user
      if (seq1.length !== seq2.length) {
        document.getElementById("lengthNote").textContent =
          "Note: Sequences are different lengths. Comparing first " + shorterLength + " letters.";
      } else {
        document.getElementById("lengthNote").textContent = "";
      }

      // Build the color-coded letter display
      var seq1HTML = "";
      var seq2HTML = "";

      for (var j = 0; j < shorterLength; j++) {
        // If letters match, color them green. If not, color them red.
        if (seq1[j] === seq2[j]) {
          seq1HTML += "<span class='match'>" + seq1[j] + "</span>";
          seq2HTML += "<span class='match'>" + seq2[j] + "</span>";
        } else {
          seq1HTML += "<span class='no-match'>" + seq1[j] + "</span>";
          seq2HTML += "<span class='no-match'>" + seq2[j] + "</span>";
        }
      }

      // Add any leftover letters (from the longer sequence) in gray
      for (var k = shorterLength; k < seq1.length; k++) {
        seq1HTML += "<span style='color: gray;'>" + seq1[k] + "</span>";
      }
      for (var m = shorterLength; m < seq2.length; m++) {
        seq2HTML += "<span style='color: gray;'>" + seq2[m] + "</span>";
      }

      // Put the colored letters into the page
      document.getElementById("seq1Display").innerHTML = seq1HTML;
      document.getElementById("seq2Display").innerHTML = seq2HTML;

      // Count letters in both sequences
      var seq1Counts = countLetters(seq1);
      var seq2Counts = countLetters(seq2);

      // Display letter counts for sequence 1
      document.getElementById("seq1Counter").innerHTML =
        "<h4>Sequence 1 Letters:</h4>" +
        "<p>A: " + seq1Counts.A + "</p>" +
        "<p>T: " + seq1Counts.T + "</p>" +
        "<p>G: " + seq1Counts.G + "</p>" +
        "<p>C: " + seq1Counts.C + "</p>";

      // Display letter counts for sequence 2
      document.getElementById("seq2Counter").innerHTML =
        "<h4>Sequence 2 Letters:</h4>" +
        "<p>A: " + seq2Counts.A + "</p>" +
        "<p>T: " + seq2Counts.T + "</p>" +
        "<p>G: " + seq2Counts.G + "</p>" +
        "<p>C: " + seq2Counts.C + "</p>";

      // Display a random DNA fact
      var randomFact = getRandomFact();
      document.getElementById("dnaFact").textContent = "Fun Fact: " + randomFact;

      // ===== DETECT AND DISPLAY MUTATION POSITIONS =====
      // Find where mismatches occurred
      var mutationPositions = detectMutationPositions(seq1, seq2);
      displayMutationPositions(mutationPositions);

      // ===== ADD TO COMPARISON HISTORY =====
      // Store this comparison in the history (only the shorter length for accuracy)
      addToHistory(seq1, seq2, similarityRounded);
    }
  </script>
